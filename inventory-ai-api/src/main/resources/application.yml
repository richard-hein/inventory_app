spring:
  application.name: inventory-ai-api
  datasource:
    url: jdbc:postgresql://localhost:5533/inventory
    username: inventory
    password: secret
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data.redis:
    host: localhost
    port: 6379
    timeout: 2s
  cache:
    type: redis
    redis.time-to-live: 10m
  ai.ollama:
    base-url: http://localhost:11434
    chat.model: llama3.1:8b
    embedding.model: nomic-embed-text
  ai.vectorstore.pgvector:
    initialize-schema: true
    index-type: HNSW
    distance-type: COSINE_DISTANCE
    dimensions: 768 # ponytail: match nomic-embed-text; change if you swap embedding model

server.port: 8080

management.endpoints.web.exposure.include: health,info
management.endpoint.health.show-details: when-authorized

springdoc.api-docs.path: /v3/api-docs
springdoc.swagger-ui.path: /swagger-ui.html

app.jwt:
  secret: ${JWT_SECRET:change-me-to-32-bytes-minimum-secret!!}
  access-ttl-minutes: 15
  refresh-ttl-days: 7
