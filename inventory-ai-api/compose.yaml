services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=inventory'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=inventory'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5533:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
  ollama:
    image: 'ollama/ollama:latest'
    ports:
      - '11434:11434'
    volumes:
      - ollama:/root/.ollama
    # ponytail: pull once after up: ollama pull llama3.1:8b; ollama pull nomic-embed-text

volumes:
  pgdata:
  redisdata:
  ollama:
